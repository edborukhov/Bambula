kind = "mobile"
previewPath = "/"
title = "Workout App"
version = "1.0.0"
id = "artifacts/workout-app"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 19730

[services.development]
run = "pnpm --filter @workspace/workout-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/workout-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/workout-app", "run", "serve" ]

[services.env]
PORT = "19730"
BASE_PATH = "/"
